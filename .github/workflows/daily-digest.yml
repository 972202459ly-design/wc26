name: Daily Digest

on:
  schedule:
    # Once a day at 13:00 UTC — after overnight results settle, before the
    # day's matches kick off.
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-digest endpoint
        # Reuses the existing DAILY_PICKS_URL secret — its value must point at
        # the digest endpoint: https://wc26live.org/api/cron/daily-digest?key=<CRON_SECRET>
        run: |
          curl -s -f "${{ secrets.DAILY_PICKS_URL }}" || echo "Daily Digest skipped (no DAILY_PICKS_URL configured)"
