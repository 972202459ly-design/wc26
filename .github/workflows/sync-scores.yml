name: Sync Match Scores

on:
  schedule:
    # Every 30 minutes during World Cup hours (matches typically 10:00-02:00 UTC)
    - cron: "*/30 8-23 * * *"
    - cron: "0 0-2 * * *"
  workflow_dispatch: # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -s -f -L --max-redirs 3 "${{ secrets.SYNC_URL }}" || echo "Sync skipped (no SYNC_URL configured)"
