name: Sync Match Scores

on:
  schedule:
    # Every 30 minutes during match hours (8:00-23:59 UTC)
    - cron: "*/30 8-23 * * *"
    # After-hours sync (0:00-2:59 UTC) for late matches
    - cron: "0 0,1,2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -s -f "${{ secrets.SYNC_URL }}" || echo "Sync skipped (no SYNC_URL configured)"
