name: Daily Picks Digest

on:
  schedule:
    # Once a day at 13:00 UTC (~morning in the Americas, before most matches).
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  daily-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-picks endpoint
        run: |
          curl -s -f "${{ secrets.DAILY_PICKS_URL }}" || echo "Daily Picks skipped (no DAILY_PICKS_URL configured)"
